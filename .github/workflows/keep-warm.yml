name: keep-warm

# Render's free tier spins the service down after ~15 min of inactivity, and the
# next request then takes ~30-60s to cold-start — during which every page of the
# app fails to load. This workflow pings the backend on a schedule so it never
# goes to sleep. (For higher reliability use an external monitor like UptimeRobot
# or cron-job.org at a 5-minute interval, or move the service to a paid plan.)

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}        # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://backend-chq9.onrender.com/api/payout-ranges || echo "000")
            echo "attempt $i -> HTTP $code"
            # any HTTP response (even 401/403/404) means the server is awake
            if [ "$code" != "000" ]; then exit 0; fi
            sleep 20
          done
          echo "backend did not respond after retries"
